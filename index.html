/* ================= Sieg ================= */
function celebrate() {
  sfx.win(); confetti(); showWin();
  const g = S.game;
  if (g && g.players.some(p => g.winners.includes(p.id) && skinOf(avaOf(p)).r === 5)) setTimeout(() => sfx.flip7(), 4000);
}
function showWin() {
  const g = S.game, t = totals(g);
  const ws = g.players.filter(p => g.winners.includes(p.id));
  if (!ws.length) return;
  const shared = ws.length > 1, rw = g.rewards;
  const sorted = [...g.players].sort((a, b) => t[b.id] - t[a.id]);
  const w = $('#win');
  w.innerHTML = `<div class="win-rays" aria-hidden="true"></div>
  <div class="win-card" role="dialog" aria-modal="true" aria-labelledby="win-title">
    <div class="win-kicker">${shared ? 'Geteilter Sieg' : 'Spiel vorbei'} nach ${g.rounds.length} Runden</div>
    <div class="win-avas">${ws.map(p => avaHTML(avaOf(p), shared ? 76 : 96)).join('')}</div>
    <div class="win-big">Sieg!</div>
    <h2 id="win-title" class="win-names">${ws.map(p => `<span style="--pc:${p.color}">${esc(p.name)}</span>`).join('<i>&amp;</i>')}</h2>
    <div class="win-score">${shared ? 'Punktgleich mit' : 'mit'} ${t[ws[0].id]} Punkten</div>
    <ol class="win-list">${sorted.map(p => `<li>${avaHTML(avaOf(p), 26)}<span class="pl">${sorted.findIndex(q => t[q.id] === t[p.id]) + 1}.</span><span>${esc(p.name)}</span><b>${t[p.id]}</b>${rw ? `<em class="chip-gain">+${t[p.id]} ${ICON.chip}</em>` : '<em></em>'}</li>`).join('')}</ol>
    ${rw ? `<div class="win-cases">${caseButtons(g)}</div>` : `<p class="win-note">${g.demo ? 'Im Beispielspiel gibt es keine Chips.' : 'Chips und Kisten gibt es erst ab 3 gespielten Runden.'}</p>`}
    <div class="win-actions">${endButtons(g)}<button class="btn btn-ghost" data-act="win-close">Schließen</button></div>
    <div class="win-made">Made by <b>Hatozoro</b></div>
  </div>`;
  w.hidden = false;
}
function hideWin() { const w = $('#win'); w.hidden = true; w.innerHTML = ''; }

function confetti(custom) {
  if (reduced()) return;
  const cv = $('#confetti'), cx = cv.getContext('2d');
  if (!cx) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1), W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; cv.hidden = false; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cols = custom || [...(S.game ? S.game.players.map(p => p.color) : COLORS.slice(0, 6)), '#FFC530', '#FFFFFF', '#5B3DF5'];
  const P = [];
  for (let i = 0; i < 240; i++) {
    const left = i % 2 === 0;
    P.push({ x: left ? -10 : W + 10, y: H * (0.55 + Math.random() * 0.2), vx: (left ? 1 : -1) * (3 + Math.random() * 10), vy: -(9 + Math.random() * 13),
      w: 6 + Math.random() * 7, h: 9 + Math.random() * 10, r: Math.random() * 6, vr: (Math.random() - .5) * .35, c: cols[i % cols.length], ph: Math.random() * 10, delay: Math.random() * 500 });
  }
  const start = performance.now();
  (function frame(now) {
    const el = now - start;
    cx.clearRect(0, 0, W, H);
    P.forEach(p => {
      if (el < p.delay) return;
      p.vy = Math.min(p.vy + 0.27, 4.2); p.vx *= 0.985;
      p.x += p.vx + Math.sin(el / 260 + p.ph) * 0.8; p.y += p.vy; p.r += p.vr;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r);
      cx.globalAlpha = Math.max(0, Math.min(1, 1 - (el - 4200) / 1400));
      cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(el / 170 + p.ph)) + 1);
      cx.restore();
    });
    if (el < 5700) requestAnimationFrame(frame); else { cx.clearRect(0, 0, W, H); cv.hidden = true; }
  })(start);
}

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.hidden = false;
  t.style.animation = 'none'; void t.offsetWidth; t.style.animation = '';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2300);
}

/* ================= Aktionen ================= */
function doRematch() {
  const old = S.game;
  S.game = newGame(old.players.map(p => p.name), old.target, (old.startDealer + 1) % old.players.length);
  S.draft = {}; S.tab = 'enter'; S.view = 'game'; lastTotals = null;
  render(); window.scrollTo(0, 0); sfx.shuffle();
  toast(`Neues Spiel! ${S.game.players[S.game.startDealer].name} gibt zuerst.`);
}
function startGame() {
  const su = S.setup, err = $('#setup-err');
  const rows = su.names.map((n, i) => ({ n: n.trim(), i })).filter(r => r.n);
  if (rows.length < 2) { err.textContent = 'Trag mindestens zwei Namen ein.'; return; }
  const keys = rows.map(r => r.n.toLowerCase());
  const dup = keys.find((k, i) => keys.indexOf(k) !== i);
  if (dup) { err.textContent = `„${rows[keys.indexOf(dup)].n}“ steht doppelt drin. Gib den beiden unterschiedliche Namen.`; return; }
  const startDealer = Math.max(0, rows.findIndex(r => r.i === su.dealer));
  const go = () => {
    leaveDemo();
    S.game = newGame(rows.map(r => r.n), su.target, startDealer);
    rows.forEach(r => { const pr = ensureProfile(r.n); const av = (su.avas || [])[r.i]; if (av) pr.avatar = av; });
    S.draft = {}; S.view = 'game'; S.tab = 'enter'; lastTotals = null;
    render(); window.scrollTo(0, 0); sfx.shuffle();
    toast(`${rows[startDealer].n} gibt zuerst. Viel Glück!`);
  };
  const cur = S.mode === 'demo' ? (S.stash && S.stash.game) : S.game;
  if (cur && !cur.demo && !cur.finished && cur.rounds.length) {
    ask('Laufendes Spiel ersetzen?', `Das Spiel mit ${nameList(cur.players.map(p => p.name))} (Runde ${cur.rounds.length + 1}) wird verworfen und nicht gezählt.`, 'Neues Spiel starten', go);
  } else go();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const a = el.dataset.act, pid = el.dataset.pid, g = S.game;
  switch (a) {
    case 'sound': S.sound = !S.sound; persist(); renderTop(); if (S.sound) sfx.save(); toast(S.sound ? 'Ton an' : 'Ton aus'); break;
    case 'menu': openSheet({ type: 'menu' }); sfx.click(); break;
    case 'tab': S.tab = el.dataset.tab; sfx.click(); render(); break;
    case 'bust': toggleBust(pid); break;
    case 'f7': toggleF7(pid); break;
    case 'calc': openCalc(pid); break;
    case 'save-round': saveRound(); break;
    case 'undo':
      if (!g.rounds.length) break;
      ask('Letzte Runde löschen?', `Runde ${g.rounds.length} wird komplett entfernt. Die Punkte aller Spieler aus dieser Runde fallen weg.`, 'Runde löschen', () => {
        g.rounds.pop(); syncFinish(g); render(); sfx.undo(); toast(`Runde ${g.rounds.length + 1} gelöscht`);
      });
      break;
    case 'cell': openEdit(+el.dataset.r, pid); break;
    case 'replay': celebrate(); break;
    case 'go-setup': closeSheet(); hideWin(); leaveDemo(); S.setup = initSetup(); S.view = 'setup'; render(); window.scrollTo(0, 0); break;
    case 'go-home': closeSheet(); hideWin(); leaveDemo(); S.view = 'home'; render(); window.scrollTo(0, 0); break;
    case 'resume': if (S.game) { S.view = 'game'; render(); window.scrollTo(0, 0); sfx.click(); } break;
    case 'demo-start': closeSheet(); enterDemo(); render(); window.scrollTo(0, 0); sfx.shuffle(); break;
    case 'demo-restart': closeSheet(); hideWin(); enterDemo(); render(); window.scrollTo(0, 0); sfx.shuffle(); toast('Beispiel neu gestartet'); break;
    case 'demo-exit': closeSheet(); hideWin(); leaveDemo(); S.view = 'home'; render(); window.scrollTo(0, 0); break;
    case 'discard':
      closeSheet();
      ask('Spiel verwerfen?', 'Alle Runden dieses Spiels werden gelöscht. Es zählt nicht für die Bestenliste.', 'Verwerfen', () => {
        S.game = null; S.draft = {}; S.view = 'home'; lastTotals = null; render(); window.scrollTo(0, 0); sfx.undo(); toast('Spiel verworfen');
      });
      break;
    case 'go-board': closeSheet(); hideWin(); S.view = 'board'; render(); window.scrollTo(0, 0); break;
    case 'go-game': closeSheet(); S.view = S.game ? 'game' : 'home'; render(); break;
    case 'rematch':
      closeSheet(); hideWin();
      if (g && g.demo) { enterDemo(); render(); sfx.shuffle(); break; }
      if (g && g.rounds.length && !g.finished && !g.demo) ask('Revanche starten?', 'Das laufende Spiel wird abgebrochen und nicht in der Bestenliste gezählt.', 'Neues Spiel', doRematch);
      else doRematch();
      break;
    case 'win-close': hideWin(); break;
    case 'go-players': closeSheet(); hideWin(); leaveDemo(); S.view = 'players'; render(); window.scrollTo(0, 0); break;
    case 'open-profile': S.profileKey = el.dataset.key; S.view = 'profile'; sfx.click(); render(); window.scrollTo(0, 0); break;
    case 'set-ava': { const pr = S.profiles[el.dataset.key]; if (pr) { pr.avatar = el.dataset.a; sfx.flick(); render(); } break; }
    case 'equip': { const pr = S.profiles[el.dataset.key]; if (pr && pr.owned.includes(el.dataset.skin)) { pr.skin = el.dataset.skin; sfx.save(); render(); } break; }
    case 'locked': sfx.click(); toast('Noch nicht gezogen. Öffne Kisten, um ihn zu finden.'); break;
    case 'open-case': openCase(el.dataset.key); break;
    case 'case-equip': { const pr = S.profiles[el.dataset.key]; if (pr) { pr.skin = el.dataset.skin; persist(); el.outerHTML = '<span class="pill">Angelegt</span>'; sfx.save(); } break; }
    case 'case-close': hideCase(); render(); if (!$('#win').hidden) showWin(); break;
    case 'pick-ava': openSheet({ type: 'avapick', i: +el.dataset.i }); sfx.click(); break;
    case 'pick-ava-set': { const i = sheet.i; S.setup.avas = S.setup.avas || []; S.setup.avas[i] = el.dataset.a; closeSheet(); sfx.flick(); render(); break; }
    case 'del-profile': {
      const k = el.dataset.key, pr = S.profiles[k];
      if (!pr) break;
      ask('Profil löschen?', `${pr.name} verliert Avatar, Chips und alle Skins. Die Bestenliste bleibt.`, 'Löschen', () => { delete S.profiles[k]; S.view = 'players'; render(); toast('Profil gelöscht'); });
      break;
    }
    case 'install': installApp(); break;
    case 'clear-history':
      ask('Bestenliste löschen?', 'Alle gespeicherten Spiele und Siege werden entfernt. Das lässt sich nicht rückgängig machen.', 'Alles löschen', () => { S.history = []; render(); toast('Bestenliste gelöscht'); });
      break;
    /* Setup */
    case 'add-player':
      if (S.setup.names.length >= MAX_PLAYERS) break;
      S.setup.names.push(''); render(); { const i = $('#name-' + (S.setup.names.length - 1)); if (i) i.focus(); } break;
    case 'rm-player': {
      const i = +el.dataset.i; S.setup.names.splice(i, 1); (S.setup.avas || []).splice(i, 1);
      if (S.setup.dealer === i) S.setup.dealer = 0; else if (S.setup.dealer > i) S.setup.dealer--;
      render(); break;
    }
    case 'mv': {
      const i = +el.dataset.i, j = i + (+el.dataset.d), n = S.setup.names;
      if (j < 0 || j >= n.length) break;
      [n[i], n[j]] = [n[j], n[i]];
      const av = S.setup.avas || (S.setup.avas = []); [av[i], av[j]] = [av[j], av[i]];
      if (S.setup.dealer === i) S.setup.dealer = j; else if (S.setup.dealer === j) S.setup.dealer = i;
      render(); break;
    }
    case 'first-dealer': S.setup.dealer = +el.dataset.i; sfx.flick(); render(); break;
    case 'quick-add': {
      const n = S.setup.names, empty = n.findIndex(x => !x.trim());
      if (empty >= 0) n[empty] = el.dataset.name; else if (n.length < MAX_PLAYERS) n.push(el.dataset.name);
      sfx.click(); render(); break;
    }
    case 'target': S.setup.target = +el.dataset.v; sfx.click(); render(); break;
    case 'start-game': startGame(); break;
    /* Sheets */
    case 'close-sheet': closeSheet(); break;
    case 'cok': { const fn = sheet && sheet.fn; closeSheet(); if (fn) fn(); break; }
    case 'cnum': {
      const n = +el.dataset.n, i = sheet.nums.indexOf(n);
      if (i >= 0) { sheet.nums.splice(i, 1); sfx.flick(); }
      else if (sheet.nums.length < 7) { sheet.nums.push(n); if (sheet.nums.length === 7) sfx.flip7(); else sfx.flick(); }
      renderSheet(); break;
    }
    case 'cmod': { const m = +el.dataset.m, i = sheet.mods.indexOf(m); if (i >= 0) sheet.mods.splice(i, 1); else sheet.mods.push(m); sfx.flick(); renderSheet(); break; }
    case 'cx2': sheet.x2 = !sheet.x2; sfx.flick(); renderSheet(); break;
    case 'cclear': sheet.nums = []; sheet.mods = []; sheet.x2 = false; sfx.undo(); renderSheet(); break;
    case 'cbust': { const p = sheet.pid, d = getDraft(p); d.b = true; d.f = false; d.v = ''; d.cards = null; closeSheet(); render(); bustFx(p); break; }
    case 'capply': {
      const p = sheet.pid, d = getDraft(p), r = calcResult(sheet);
      d.b = false; d.v = String(r.base); d.f = r.f7; d.cards = { nums: [...sheet.nums], mods: [...sheet.mods], x2: sheet.x2 };
      closeSheet(); render(); sfx.save(); break;
    }
    case 'ef7': sheet.f = !sheet.f; if (sheet.f) { sheet.b = false; sfx.flip7(); } else sfx.click(); renderSheet(); break;
    case 'ebust': sheet.b = !sheet.b; if (sheet.b) { sheet.f = false; sfx.bust(); } else sfx.click(); renderSheet(); break;
    case 'esave': {
      if (!sheet.b && sheet.v === '') { $('#edit-err').textContent = 'Trag eine Zahl ein oder markier die Runde als Bust.'; break; }
      const { ri, pid: p, b, f, v } = sheet;
      g.rounds[ri].sc[p] = b ? { p: 0, b: true, f: false } : { p: (+v) + (f ? 15 : 0), b: false, f: !!f };
      closeSheet();
      const newly = syncFinish(g); render();
      if (newly) celebrate(); else { sfx.save(); toast('Korrigiert'); }
      break;
    }
  }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.classList.contains('score-in') && el.dataset.pid) {
    const d = getDraft(el.dataset.pid);
    const v = el.value.replace(/\D/g, '').slice(0, 3);

    const pv = $('#prev-' + el.dataset.pid); if (pv) pv.innerHTML = prevText(d);
    updateSaveState(); persist();
  } else if (el.id === 'edit-in' && sheet) {
    const v = el.value.replace(/\D/g, '').slice(0, 3);
    if (el.value !== v) el.value = v;
    sheet.v = v;
    const pv = $('#edit-prev'); if (pv) pv.textContent = v === '' ? '' : sheet.f ? `${v} + 15 = ${+v + 15} Punkte` : `${v} Punkte`;

    S.setup.names[+el.dataset.i] = el.value;
    const ab = $('#ava-' + el.dataset.i); if (ab) ab.innerHTML = avaHTML(setupAva(+el.dataset.i), 44);
    const err = $('#setup-err'); if (err) err.textContent = '';
    persist();
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#case').hidden) { hideCase(); render(); } else if (sheet) closeSheet(); else if (!$('#win').hidden) hideWin(); return; }
  if (e.key !== 'Enter') return;
  const el = e.target;
  if (el.classList.contains('score-in') && el.dataset.pid) {
    e.preventDefault();
    const all = [...document.querySelectorAll('.erow .score-in')];
    const next = all[all.indexOf(el) + 1];
    if (next) next.focus(); else { const b = $('#save-btn'); if (b && !b.disabled) b.focus(); else el.blur(); }
  } else if (el.id === 'edit-in') { e.preventDefault(); const b = $('[data-act="esave"]'); if (b) b.click(); }
  else if (el.classList.contains('name-in')) {
    e.preventDefault();
    const i = +el.dataset.i, nx = $('#name-' + (i + 1));
    if (nx) nx.focus(); else if (S.setup.names.length < MAX_PLAYERS && el.value.trim()) { S.setup.names.push(''); render(); const ni = $('#name-' + (i + 1)); if (ni) ni.focus(); }
  }
});

let rz = null;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S && S.view === 'game' && S.tab === 'chart') drawChart(); }, 150); });

document.addEventListener('pointerdown', keepAwake, { passive: true });

}
try { window.claude?.hot?.snapshot?.(() => ({ S })); } catch (e) {}
